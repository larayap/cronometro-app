<!-- Arte del icono ajustado para los tamaños medios del .ico (32, 40 y 48 px).

     Deriva de `public/icon-app.svg`, que es el maestro y la única fuente del
     dibujo. La diferencia son los grosores: en el maestro el aro del dial mide
     9,91 px y las manecillas 13,55 px sobre la grilla de 256, lo que al bajar a
     32 px deja trazos de 1,2 y 1,7 px. Por debajo del píxel el antialiasing los
     convierte en gris y el dial se lee lavado, así que acá el aro sube a 15 px,
     las manecillas a 19 px y la ranura del botón a 15 px; el radio del aro baja
     de 74,43 a 71 px para que el engrosamiento no lo pegue al borde del disco.

     Los tamaños de 64 px para arriba se rasterizan del maestro sin ajustar, y
     los de 24 px para abajo usan `icon-app-small.svg`. El reparto vive en
     `build/icons/generate-icons.py`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect id="fondo" width="256" height="256" fill="#000000"/>

  <!-- Silueta blanca: botón superior, cuello y caja del cronómetro -->
  <g fill="#ffffff">
    <rect x="54.19" y="7.06" width="146.13" height="33.17" rx="5.5"/>
    <path d="M85 38 L85 40.2
             Q94.77 45.2 80.63 52.98
             L175.53 52.98
             Q161.39 45.2 171.16 40.2 L171.16 38 Z"/>
    <circle cx="128.08" cy="144.56" r="103.14"/>
  </g>

  <!-- Detalles calados en negro: ranura del botón, aro del dial y manecillas -->
  <g fill="none" stroke="#000000">
    <path d="M72.5 24.3 H182" stroke-width="15" stroke-linecap="round"/>
    <circle cx="128.08" cy="144.56" r="71" stroke-width="15"/>
    <path d="M126.25 100 V149 H160"
          stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
